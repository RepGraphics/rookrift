services:
  rookrift:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/rookrift.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - rookrift-data:/app/data
    stop_grace_period: 3m
volumes:
  rookrift-data:
