services:
  rookrift:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: rookrift
      PGUSER: rookrift
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 3m
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    restart: unless-stopped
    command: listen --api-key ${STRIPE_CLI_API_KEY:-} --events checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed --forward-to http://rookrift:3000/api/webhooks/stripe
    depends_on:
      rookrift:
        condition: service_healthy
  stripe-connect-cli:
    image: stripe/stripe-cli:latest
    profiles: ["stripe"]
    restart: unless-stopped
    command: listen --api-key ${STRIPE_CLI_API_KEY:-} --events account.updated,checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired,charge.refunded,charge.dispute.created,charge.dispute.closed --forward-connect-to http://rookrift:3000/api/webhooks/community-stripe
    depends_on:
      rookrift:
        condition: service_healthy
  link-agent:
    build: .
    profiles: ["link-agent"]
    restart: unless-stopped
    command: ["node", "scripts/link-agent.mjs"]
    environment:
      LINK_LOG_PATH: ${LINK_LOG_PATH:-/logs/server.log}
      ROOKRIFT_LINK_ENDPOINT: ${ROOKRIFT_LINK_ENDPOINT:-http://rookrift:3000/api/link-events}
      ROOKRIFT_LINK_TOKEN: ${ROOKRIFT_LINK_TOKEN:-}
      ROOKRIFT_SERVER_ID: ${ROOKRIFT_SERVER_ID:-}
    volumes:
      - ${LINK_LOG_HOST_PATH:-./logs}:${LINK_LOG_PATH:-/logs/server.log}:ro
    depends_on:
      rookrift:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rookrift
      POSTGRES_USER: rookrift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - rookrift-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rookrift -d rookrift"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["/bin/sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --save "" --appendonly no']
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  rookrift-postgres:
